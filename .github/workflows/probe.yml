name: probe-sources
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装 Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python3 probe.py
      - run: python3 render.py || echo render-skip
      - run: |
          git config user.name lotto-bot
          git config user.email lotto-bot@users.noreply.github.com
          git add probe-report.json macau_diag.json macau_rendered.json peek.json
          git commit -m "diag" --allow-empty
          git push
