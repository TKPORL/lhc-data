name: 港澳六合彩抓取

on:
  # GitHub 的 cron 用 UTC，北京时间 = UTC+8。只在傍晚开奖时段刷，省额度。
  schedule:
    - cron: '0 12 * * *'    # 北京 20:00
    - cron: '30 13 * * *'   # 北京 21:30
    - cron: '40 13 * * *'   # 北京 21:40
  push:
    paths:
      - 'upstreams.json'
      - 'scrape.py'
      - 'render.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装 Playwright（渲染 JS 站点用）
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: 渲染 JS 站点（澳门）
        run: python3 render.py || echo "render skipped/failed, 继续用 http 源"
      - name: 抓取并写 results.json
        run: python3 scrape.py
      - name: 回写 results.json
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add results.json
          git commit -m "chore: refresh lottery results" --allow-empty
          git push
